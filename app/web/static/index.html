<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root { --bg: #f6f4ef; --panel: #fff; --ink: #1c1b19; --muted: #6b675f; --line: #e6e1d6; --accent: #8a6a2f; --accent-ink: #fff; --soft: #f1ece1; --user: #1c1b19; --user-ink: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121211; --panel: #1b1a18; --ink: #eeeae2; --muted: #a19c91; --line: #2d2b27; --accent: #c9a35a; --accent-ink: #121211; --soft: #24221e; --user: #eeeae2; --user-ink: #121211; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Inter, system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header h1 { font: 500 21px Fraunces, Georgia, serif; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
header .stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; color: var(--muted); background: var(--panel); }
main { flex: 1; overflow-y: auto; padding: 24px 16px; }
.wrap { max-width: 820px; margin: 0 auto; }
.hero { text-align: center; padding: 40px 0 18px; }
.hero h2 { font: 500 30px Fraunces, Georgia, serif; margin: 0 0 8px; }
.hero p { color: var(--muted); margin: 0 auto; max-width: 560px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 9px 13px; font: inherit; font-size: 13.5px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.msg { margin: 18px 0; display: flex; }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 100%; border-radius: 16px; padding: 12px 16px; }
.user .bubble { background: var(--user); color: var(--user-ink); max-width: 80%; }
.bot .bubble { background: var(--panel); border: 1px solid var(--line); width: 100%; }
.bubble p { margin: .4em 0; }
.bubble ul { padding-left: 1.2em; margin: .4em 0; }
.bubble a { color: var(--accent); }
.bubble table { border-collapse: collapse; font-size: 13.5px; margin: .5em 0; display: block; overflow-x: auto; }
.bubble td, .bubble th { border: 1px solid var(--line); padding: 4px 8px; }
.trace { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.trace code { background: var(--soft); padding: 1px 6px; border-radius: 6px; font-size: 12px; word-break: break-word; }
.meta { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--ink); background: var(--bg); }
.card:hover { border-color: var(--accent); }
.card .img { aspect-ratio: 16/10; background: var(--soft) center/cover no-repeat; }
.card .info { padding: 8px 10px; font-size: 12.5px; }
.card .price { font-weight: 600; font-size: 14px; }
.card .line { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
footer { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--bg); }
form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 11px 14px; font: inherit; max-height: 140px; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 18px; font: 600 14px Inter; cursor: pointer; }
button.send:disabled { opacity: .5; cursor: default; }
.note { max-width: 820px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }
.error { color: #b4442c; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Property Assistant</h1>
    <div class="sub">AI agent over public Dar Global &amp; Wasalt data</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <div class="hero" id="hero">
      <h2>Ask about homes, projects and prices</h2>
      <p>Answers come from a snapshot of Dar Global's international developments and a sample of Wasalt's Saudi listings. Every answer links back to the source. English or العربية.</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="e.g. 3-bedroom apartments for sale in Riyadh under 1M SAR" autofocus></textarea>
    <button class="send" id="send">Send</button>
  </form>
</footer>

<script>
const suggestions = [
  "Which Dar Global projects are in Dubai?",
  "Show 3-bedroom apartments for sale in Riyadh under 1,000,000 SAR",
  "Compare median villa prices across Saudi cities",
  "Which Dar Global developments are branded with luxury partners?",
  "Cheapest villas for rent in Jeddah",
  "أرخص الشقق للبيع في الخبر"
];

const toolNames = {
  search_listings: "Filtering Wasalt listings",
  get_listing: "Opening listing",
  market_stats: "Computing market stats",
  list_darglobal_projects: "Listing Dar Global projects",
  search_knowledge: "Searching scraped pages"
};

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const main = document.getElementById("main");
const history = [];

function escapeHtml(text) {
  if (text == null) return "";
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatPrice(price) {
  if (!price) return "Price on request";
  return Number(price).toLocaleString("en-US") + " SAR";
}

function markdownToHtml(text) {
  return DOMPurify.sanitize(marked.parse(text || ""));
}

function scrollToBottom() {
  main.scrollTop = main.scrollHeight;
}

function addMessage(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = '<div class="bubble">' + html + "</div>";
  chat.appendChild(div);
  scrollToBottom();
  return div.querySelector(".bubble");
}

function buildCards(listings) {
  if (!listings || listings.length === 0) return "";

  let html = '<div class="cards">';
  for (const item of listings) {
    let price = formatPrice(item.price);
    if (item.purpose === "rent") price += " /yr";

    let details = [item.district, item.city].filter(Boolean).join(", ");
    if (item.bedrooms) details += " · " + item.bedrooms + " bd";
    if (item.area_sqm) details += " · " + Math.round(item.area_sqm) + " m²";

    html += '<a class="card" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">';
    html += '<div class="img" style="background-image:url(\'' + escapeHtml(item.image || "") + '\')"></div>';
    html += '<div class="info">';
    html += '<div class="price">' + price + "</div>";
    html += '<div class="line">' + escapeHtml(item.title) + "</div>";
    html += '<div class="line">' + escapeHtml(details) + "</div>";
    html += "</div></a>";
  }
  html += "</div>";
  return html;
}

function showEvent(event, trace, body, question) {
  if (event.type === "tool") {
    const label = toolNames[event.name] || event.name;
    trace.innerHTML += "<div>↳ " + escapeHtml(label) + " <code>" + escapeHtml(JSON.stringify(event.args)) + "</code></div>";
  }

  if (event.type === "answer") {
    let footer = escapeHtml(event.model || "");
    if (event.seconds) footer += " · " + event.seconds + "s";
    if (event.cached) footer += " · cached";

    body.innerHTML = markdownToHtml(event.text) + buildCards(event.cards) + '<div class="meta">' + footer + "</div>";
    for (const link of body.querySelectorAll("a")) {
      link.target = "_blank";
      link.rel = "noopener";
    }
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: event.text });
  }

  if (event.type === "error") {
    body.innerHTML = '<span class="error">' + escapeHtml(event.text) + "</span>";
  }
  scrollToBottom();
}

async function ask(question) {
  question = question.trim();
  if (!question || sendButton.disabled) return;

  const hero = document.getElementById("hero");
  if (hero) hero.remove();

  addMessage("user", escapeHtml(question));
  input.value = "";
  sendButton.disabled = true;

  const bubble = addMessage("bot", '<div class="trace"></div><div class="body">Thinking...</div>');
  const trace = bubble.querySelector(".trace");
  const body = bubble.querySelector(".body");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question, history: history })
    });

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.error || "Request failed: " + response.status);
    }

    // the server sends events as "data: {...}" separated by blank lines
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        if (part.startsWith("data:")) {
          showEvent(JSON.parse(part.slice(5)), trace, body, question);
        }
      }
    }
  } catch (error) {
    body.innerHTML = '<span class="error">' + escapeHtml(error.message) + "</span>";
  }

  sendButton.disabled = false;
  input.focus();
}

fetch("/api/stats")
  .then(response => response.json())
  .then(stats => {
    document.getElementById("stats").innerHTML =
      '<span class="pill">' + stats.darglobal_projects + " Dar Global projects</span>" +
      '<span class="pill">' + stats.wasalt_listings + " Wasalt listings · " + stats.cities + " cities</span>" +
      '<span class="pill">Snapshot ' + escapeHtml(stats.snapshot) + "</span>";
  })
  .catch(() => {});

const chips = document.getElementById("chips");
for (const text of suggestions) {
  const button = document.createElement("button");
  button.className = "chip";
  button.textContent = text;
  button.onclick = () => ask(text);
  chips.appendChild(button);
}

document.getElementById("form").onsubmit = function (e) {
  e.preventDefault();
  ask(input.value);
};

input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ask(input.value);
  }
});

input.addEventListener("input", function () {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
</script>
</body>
</html>
